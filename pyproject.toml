[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yaml-memory-tracer"
version = "0.1.0"
description = "YAML-configured JSONL tracing for Python agent memory operations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
viewer = ["fastapi>=0.100"]
dev = ["fastapi>=0.100", "pytest>=7"]

[project.scripts]
memory-trace-report = "memory_tracer.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
